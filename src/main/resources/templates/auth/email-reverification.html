<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Xác nhận Email | Wangzhou Sourcing</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .editorial-gradient { background: linear-gradient(135deg, #003461 0%, #004b87 100%); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
</head>
<body class="bg-surface font-body text-on-surface flex items-center justify-center min-h-screen p-6">

<main class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden border border-outline-variant/10">
    <div class="editorial-gradient h-32 flex items-center justify-center">
        <div class="w-16 h-16 bg-white/10 backdrop-blur-lg rounded-full flex items-center justify-center border border-white/20">
            <span class="material-symbols-outlined text-white text-3xl animate-bounce">forward_to_inbox</span>
        </div>
    </div>

    <div class="p-8 text-center">
        <h1 class="font-headline text-2xl font-extrabold text-primary tracking-tight mb-2">Check your inbox</h1>
        <p class="text-on-surface-variant text-sm mb-8 italic">
            Chúng tôi đã gửi link xác nhận đến: <br/>
            <strong class="text-primary not-italic" th:text="${param.email}">user@example.com</strong>
        </p>

        <div th:if="${error}" class="mb-6 p-4 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl font-medium" th:text="${error}"></div>
        <div th:if="${message}" class="mb-6 p-4 bg-green-50 border border-green-100 text-green-700 text-xs rounded-xl font-medium" th:text="${message}"></div>

        <form th:action="@{/auth/verify-email}" method="post" class="mb-8 text-left p-4 bg-surface-container-low rounded-2xl">
        </form>

        <form th:action="@{/auth/resend-verification}" method="post" id="resendForm">
            <input type="hidden" name="email" th:value="${param.email}" />
            <button type="submit" id="resendBtn" class="text-primary font-headline font-bold text-[11px] tracking-widest uppercase hover:underline inline-flex items-center gap-2">
                Chưa nhận được mail? Gửi lại ngay
            </button>
        </form>

        <p id="timer" class="mt-2 text-[10px] uppercase tracking-widest font-bold text-outline hidden">
            Gửi lại sau <span id="seconds">60</span>s
        </p>

        <div class="mt-10 pt-6 border-t border-outline-variant/10">
            <a th:href="@{/auth/login}" class="text-xs font-bold text-outline hover:text-primary transition-colors inline-flex items-center gap-2">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Quay lại Đăng nhập
            </a>
        </div>
    </div>
</main>

<script>
    const resendBtn = document.getElementById('resendBtn');
    const timerText = document.getElementById('timer');
    const secondsSpan = document.getElementById('seconds');

    document.getElementById('resendForm').onsubmit = function() {
        resendBtn.disabled = true;
        resendBtn.style.opacity = '0.5';
        resendBtn.style.cursor = 'not-allowed';
        timerText.classList.remove('hidden');
        let timeLeft = 60;

        const interval = setInterval(() => {
            timeLeft--;
            secondsSpan.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(interval);
                resendBtn.disabled = false;
                resendBtn.style.opacity = '1';
                resendBtn.style.cursor = 'pointer';
                timerText.classList.add('hidden');
            }
        }, 1000);
    };
</script>
</body>
</html>
