<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
<div class="max-w-md w-full bg-white shadow-lg rounded-lg p-8 text-center">
    <div class="mb-6">
        <h1 class="text-9xl font-bold text-red-500">500</h1>
        <p class="text-2xl font-semibold text-gray-800 mt-2">Internal Server Error</p>
    </div>

    <p class="text-gray-600 mb-8">
        Oops! Something went wrong on our end. We are currently working to fix the issue.
        Please try again later.
    </p>

    <a href="/"
       class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300">
        Back to Homepage
    </a>

    <div class="mt-8 text-left p-4 bg-gray-50 border border-gray-200 rounded text-xs text-gray-500 overflow-auto max-h-40"
         th:if="${exception != null}">
        <p class="font-bold text-red-700 mb-1">Debug Information:</p>
        <p th:text="${exception.message}">Error message goes here</p>
        <pre class="mt-2" th:text="${exception.stackTrace}">Stack trace goes here</pre>
    </div>
</div>
</body>
</html>
